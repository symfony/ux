services:
    # Persist the disclosure quotas in the database, so a server restart never
    # resets a rate limit (the table is created on first save).
    app.cache.rate_limiter:
        class: Symfony\Component\Cache\Adapter\DoctrineDbalAdapter
        arguments:
            - '@doctrine.dbal.default_connection'
            # The cache namespace may not contain underscores.
            - 'ux-disclose'
            - 0

framework:
    rate_limiter:
        ux_disclose:
            policy: fixed_window
            limit: 5
            interval: '1 minute'
            cache_pool: app.cache.rate_limiter
            # Serializes concurrent consume() calls through a DBAL lock store,
            # so a burst cannot race past the quota (table auto-created).
            lock_factory: 'app.lock.factory'

# Key the disclosure rate limit on a per-visitor reference instead of the IP,
# so every browser gets an isolated budget.
disclose:
    rate_limiter_subject_factory: App\Disclose\DemoSubjectFactory
