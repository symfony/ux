ux_upload:
    storage: local
    temp_dir: '%kernel.project_dir%/var/uploads/tmp'
    local_storage:
        directory: '%kernel.project_dir%/var/uploads/storage'
    # This demo has no firewall, so Security cannot attribute an upload to anyone.
    allow_anonymous: true
    uploaders:
        # The smallest chunk size, so a browser test can send a file of several chunks
        chunked:
            chunk_size: 64K
            parallel_chunks: 1
        images:
            allowed_types: ['image/png', 'image/jpeg']
            max_size: 100K
