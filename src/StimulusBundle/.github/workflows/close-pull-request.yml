name: Close Pull Request

# pull_request_target is required here: PRs come from forks (this repo is a
# read-only subtree split) and we need a token with write access to close them.
# No checkout, no interpolation of untrusted PR data → safe.
on:
    pull_request_target: # zizmor: ignore[dangerous-triggers]
        types: [opened]

permissions: {}

jobs:
    close:
        name: Close pull request
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write # Required to comment on and close the PR.
        steps:
            - name: Close pull request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  COMMENT: |
                      Thanks for your Pull Request! We love contributions.

                      However, you should instead open your PR on the main repository:
                      https://github.com/symfony/ux

                      This repository is what we call a "subtree split": a read-only subset of that main repository.
                      We're looking forward to your PR there!
              run: gh pr close "$PR_NUMBER" --comment "$COMMENT"
