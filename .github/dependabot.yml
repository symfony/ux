# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
    # GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          github-actions:
              patterns:
                  - '*'
      cooldown:
          default-days: 7

    # npm, but only for the tooling (build, lint, tests). bin/update_tooling_dependencies.ts updates the same list locally.
    - package-ecosystem: 'npm'
      directories:
          - '/'
          - '/src/*/assets'
          - '/src/*/src/Bridge/*/assets'
      schedule:
          interval: 'weekly'
      allow:
          - dependency-name: '@playwright/test'
          - dependency-name: '@puppeteer/browsers'
          - dependency-name: '@testing-library/*'
          - dependency-name: '@tsdown/css'
          - dependency-name: '@types/node'
          - dependency-name: '@types/node-fetch'
          - dependency-name: '@types/webpack-env'
          - dependency-name: '@vitejs/*'
          - dependency-name: 'browserslist'
          - dependency-name: 'jsdom'
          - dependency-name: 'lightningcss'
          - dependency-name: 'node-fetch'
          - dependency-name: 'oxc-parser'
          - dependency-name: 'oxfmt'
          - dependency-name: 'oxlint'
          - dependency-name: 'pkg-types'
          - dependency-name: 'proxy-agent'
          - dependency-name: 'resize-observer-polyfill'
          - dependency-name: 'tinyglobby'
          - dependency-name: 'tsdown'
          - dependency-name: 'tslib'
          - dependency-name: 'typescript'
          - dependency-name: 'vitest*'
          - dependency-name: 'web-features'
          - dependency-name: 'yaml'
      ignore:
          # tsdown's dts build fails with TypeScript 7 (TS6059 rootDir errors)
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
          # jsdom 30 needs Node ^22.22.2, devEngines allows ^22.18.0
          - dependency-name: 'jsdom'
            update-types: ['version-update:semver-major']
          # Follows the Node version of .nvmrc
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
      groups:
          npm-dev-dependencies:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
          npm-dev-dependencies-major:
              patterns:
                  - '*'
              update-types:
                  - 'major'
      cooldown:
          default-days: 7
