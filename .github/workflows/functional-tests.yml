# Deprecated, will be removed in favor of browser-tests.yml
name: Functional Tests

defaults:
    run:
        shell: bash

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths:
            - '.github/workflows/functional-tests.yml'
            - 'src/Turbo/**'
    pull_request:
        paths:
            - '.github/workflows/functional-tests.yml'
            - 'src/Turbo/**'

jobs:
    turbo-tests:
        runs-on: ${{ matrix.os || 'ubuntu-latest' }}
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
                dependency-version: ['']
                symfony-version: ['']
                minimum-stability: ['stable']
                os: ['']
                include:
                    # dev packages (probably not needed to have multiple such jobs)
                    - minimum-stability: 'dev'
                      php-version: '8.5'
                    # lowest deps
                    - php-version: '8.2'
                      dependency-version: 'lowest'
                    # LTS version of Symfony
                    - php-version: '8.2'
                      symfony-version: '6.4.*'
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-version || '>=5.4' }}
        services:
            mercure:
                image: dunglas/mercure
                env:
                    SERVER_NAME: :3000
                    MERCURE_PUBLISHER_JWT_KEY: '!ChangeMe!'
                    MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeMe!'
                    MERCURE_EXTRA_DIRECTIVES: |
                        anonymous
                        cors_origins *
                ports:
                    - 3000:3000

        steps:
            - name: Checkout
              uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: Setup PHP
              uses: shivammathur/setup-php@690cb7c9d81dbfe51eba732cfca0a00ca42db777
              with:
                  php-version: ${{ matrix.php-version }}
                  tools: flex

            - name: Install root dependencies
              uses: ramsey/composer-install@5c2bcf28d7b060ef3c601d7b476d5430a7b46c27
              with:
                  working-directory: ${{ github.workspace }}

            - name: Build root packages
              run: php .github/build-packages.php

            - name: Configure composer dependencies stability
              run: composer config minimum-stability ${{ matrix.minimum-stability || 'stable' }}
              working-directory: src/Turbo

            - name: Install dependencies with composer
              uses: ramsey/composer-install@5c2bcf28d7b060ef3c601d7b476d5430a7b46c27
              with:
                  working-directory: src/Turbo
                  dependency-versions: ${{ matrix.dependency-version }}

            - name: Install JavaScript dependencies
              working-directory: src/Turbo/tests/app
              run: |
                  php public/index.php importmap:install
                  php public/index.php asset-map:compile

            - name: Create DB
              working-directory: src/Turbo/tests/app
              run: php public/index.php doctrine:schema:create

            - name: Run tests
              working-directory: src/Turbo
              run: |
                  [ 'lowest' = '${{ matrix.dependency-version }}' ] && export SYMFONY_DEPRECATIONS_HELPER=weak
                  vendor/bin/phpunit
              env:
                  SYMFONY_DEPRECATIONS_HELPER: 'max[self]=1'
