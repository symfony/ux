name: Release on NPM

on:
    push:
        tags:
            - 'v3.*.*'

permissions: {}

jobs:
    release:
        permissions:
            id-token: write # Required for OIDC
            contents: write # Required to push changes to the repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
              with:
                  ref: 3.x
                  persist-credentials: false

            - name: Configure Git
              run: |
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --global user.name "github-actions[bot]"

            - name: Extract version from tag
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

            - run: npm i -g corepack && corepack enable
              # setup-node does not enable any package-manager cache here (no `cache:` input),
              # so cache poisoning is not a concern on this release workflow.
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning]
              with:
                  registry-url: 'https://registry.npmjs.org'
                  node-version-file: '.nvmrc'

              # npm 11.5.1 or later is required for OIDC
            - run: npm install -g npm@latest

            - name: Install root JS dependencies
              run: pnpm install --frozen-lockfile

            - name: Update version of JS packages
              run: pnpm version "$VERSION" --no-git-tag-version --workspaces --no-workspaces-update

            - name: Commit changes
              run: |
                  git add .
                  git commit -m "Update versions to $VERSION"

            - name: Publish on NPM
              run: pnpm publish --recursive --access public --no-git-checks

            - name: Push changes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: git push origin 3.x
