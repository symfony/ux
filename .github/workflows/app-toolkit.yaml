name: App Toolkit

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths:
            - '.github/workflows/app-toolkit.yaml'
            - 'apps/toolkit/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'src/Icons/**'
            - 'src/Toolkit/**'
            - 'src/TwigComponent/**'
    pull_request:
        paths:
            - '.github/workflows/app-toolkit.yaml'
            - 'apps/toolkit/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'src/Icons/**'
            - 'src/Toolkit/**'
            - 'src/TwigComponent/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

permissions: {}

jobs:
    browser:
        name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  cache: true

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  extensions: intl
                  tools: symfony-cli

            - name: Install root PHP dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  working-directory: ${{ github.workspace }}

            - name: Build root PHP packages
              run: php .github/build-packages.php

            - name: Install app dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  working-directory: apps/toolkit
                  dependency-versions: highest

            - name: Run browser tests
              id: browser-tests
              run: pnpm exec playwright test -c src/Toolkit/assets --shard="$SHARD/$SHARD_TOTAL"
              env:
                  SHARD: ${{ matrix.shard }}
                  SHARD_TOTAL: ${{ strategy.job-total }}

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ always() && steps.browser-tests.conclusion == 'failure' }}
              with:
                  name: Playwright report and output (shard ${{ matrix.shard }})
                  path: |
                      src/Toolkit/assets/playwright-report/
                      src/Toolkit/assets/playwright-output/
                  retention-days: 7
                  include-hidden-files: true

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ always() && steps.browser-tests.conclusion == 'failure' }}
              with:
                  name: Symfony logs (shard ${{ matrix.shard }})
                  path: apps/toolkit/var/log/
                  retention-days: 7
