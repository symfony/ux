name: App Toolkit

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths:
            - '.github/workflows/app-toolkit.yaml'
            - 'apps/toolkit/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'src/Icons/**'
            - 'src/Toolkit/**'
            - 'src/TwigComponent/**'
    pull_request:
        paths:
            - '.github/workflows/app-toolkit.yaml'
            - 'apps/toolkit/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'src/Icons/**'
            - 'src/Toolkit/**'
            - 'src/TwigComponent/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

permissions: {}

jobs:
    browser:
        name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
        env:
            APP_ENV: prod
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  cache: true

            # Same image as the browser server in src/Toolkit/assets/playwright.config.ts
            - name: Pull the browser server image
              id: browser-server-image
              background: true
              run: |
                  version=$(node -p "require('@playwright/test/package.json').version")
                  docker pull "mcr.microsoft.com/playwright:v$version-noble"

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: intl
                  tools: symfony-cli

            - name: Install root PHP dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  working-directory: ${{ github.workspace }}

            - name: Build root PHP packages
              run: php .github/build-packages.php

            - name: Install app dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  working-directory: apps/toolkit
                  dependency-versions: highest

            - name: Compile app assets
              run: php bin/console asset-map:compile
              working-directory: apps/toolkit

            - name: Wait for the browser server image
              wait: browser-server-image

            - name: Run browser tests
              id: browser-tests
              run: pnpm exec playwright test -c src/Toolkit/assets --shard="$SHARD/$SHARD_TOTAL"
              env:
                  SHARD: ${{ matrix.shard }}
                  SHARD_TOTAL: ${{ strategy.job-total }}

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.browser-tests.conclusion == 'failure' }}
              with:
                  name: Playwright report and output (shard ${{ matrix.shard }})
                  path: |
                      src/Toolkit/assets/playwright-report/
                      src/Toolkit/assets/playwright-output/
                  retention-days: 7
                  include-hidden-files: true

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() && steps.browser-tests.conclusion == 'failure' }}
              with:
                  name: Symfony logs (shard ${{ matrix.shard }})
                  path: apps/toolkit/var/log/
                  retention-days: 7
